name: Temporary diarization qualification

on:
  push:
    branches:
      - test/diarization-real-model-183

permissions:
  contents: read

jobs:
  diarization-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYANNOTE_METRICS_ENABLED: "0"
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Check locked graph
        run: uv lock --check

      - name: Install diarization runtime
        run: uv sync --locked --extra diarization

      - name: Verify installed diarization runtime
        run: uv run python -c "import importlib.metadata as m; assert m.version('lightning') == '2.6.6'; print('lightning', m.version('lightning')); print('pyannote-audio', m.version('pyannote-audio'))"

      - name: Run diarization unit/status tests
        run: >-
          uv run pytest
          src/scholion/transcription/tests/test_diarization.py
          src/scholion/transcription/tests/test_diarization_status.py

      - name: Build distribution
        run: uv build

      - name: Verify clean wheel diarization install
        run: uv run python scripts/verify_diarization_install.py dist
