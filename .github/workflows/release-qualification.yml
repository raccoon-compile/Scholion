name: Release Qualification

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release-qualification.yml"
      - ".github/workflows/signing-candidate-prerelease.yml"
      - "frontend/src-tauri/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "packaging/media-tools.json"
      - "packaging/release-trust/**"
      - "scripts/build_desktop_runtime.py"
      - "scripts/build_release_provenance.py"
      - "scripts/prepare_signing_candidate_release.py"
      - "scripts/prepare_managed_media_tools.py"
      - "scripts/prepare_release_trust_inputs.py"
      - "scripts/scholion_runtime_entry.py"
      - "scripts/verify_packaged_media_tools.py"
      - "scripts/verify_packaged_release_trust_inputs.py"
      - "scripts/verify_production_update_fixture.py"
      - "scripts/verify_packaged_runtime_acceptance.py"
      - "scripts/verify_cross_platform_media_acceptance.py"
      - "src/scholion/**"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-qualification.yml"
      - "frontend/src-tauri/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "packaging/media-tools.json"
      - "packaging/release-trust/**"
      - "scripts/build_desktop_runtime.py"
      - "scripts/build_release_provenance.py"
      - "scripts/prepare_managed_media_tools.py"
      - "scripts/prepare_release_trust_inputs.py"
      - "scripts/scholion_runtime_entry.py"
      - "scripts/verify_packaged_media_tools.py"
      - "scripts/verify_packaged_release_trust_inputs.py"
      - "scripts/verify_production_update_fixture.py"
      - "scripts/verify_packaged_runtime_acceptance.py"
      - "scripts/verify_cross_platform_media_acceptance.py"
      - "src/scholion/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: release-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-package:
    name: preview-package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Check out repository without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Pin native Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          rustc --version
          cargo --version

      - name: Prepare reviewed managed FFmpeg and FFprobe
        run: >-
          python scripts/prepare_managed_media_tools.py
          --manifest packaging/media-tools.json
          --output build/managed-media-tools

      - name: Install locked Scholion transcription and packaging graph
        run: uv sync --locked --no-dev --extra transcription --group packaging

      - name: Export exact qualification dependency graph
        run: >-
          uv export
          --locked
          --no-dev
          --extra transcription
          --group packaging
          --no-emit-project
          --no-hashes
          --format requirements-txt
          --output-file "${{ runner.temp }}/scholion-packaging-requirements.txt"

      - name: Audit exact qualification dependency graph
        run: >-
          uvx --from pip-audit==2.10.1 pip-audit
          --requirement "${{ runner.temp }}/scholion-packaging-requirements.txt"
          --no-deps
          --disable-pip
          --progress-spinner off

      - name: Prepare reviewed production trust inputs
        run: >-
          uv run --no-sync python scripts/prepare_release_trust_inputs.py
          --update-key-catalog packaging/release-trust/update-keys.json
          --model-trust-catalog packaging/release-trust/model-trust.json
          --output build/release-trust-inputs

      - name: Build managed Scholion runtime without dependency resync
        run: >-
          uv run --no-sync python scripts/build_desktop_runtime.py
          --media-tools-dir build/managed-media-tools
          --release-trust-dir build/release-trust-inputs

      - name: Reject development tooling from frozen runtime
        shell: python
        run: |
          from pathlib import Path

          internal = Path("frontend/src-tauri/resources/runtime/_internal")
          forbidden = [internal / name for name in ("mypy", "pytest", "_pytest")]
          present = [path.as_posix() for path in forbidden if path.exists()]
          if present:
              raise SystemExit(
                  "development-only packages leaked into the frozen runtime: "
                  + ", ".join(present)
              )

      - name: Prove frozen managed media custody before bundling
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            runtime="frontend/src-tauri/resources/runtime/scholion-runtime.exe"
          else
            runtime="frontend/src-tauri/resources/runtime/scholion-runtime"
          fi
          uv run --no-sync python scripts/verify_packaged_media_tools.py \
            --runtime "$runtime" \
            --evidence build/managed-media-tools/managed-media-tools.json

      - name: Prove frozen production trust custody before bundling
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            runtime="frontend/src-tauri/resources/runtime/scholion-runtime.exe"
          else
            runtime="frontend/src-tauri/resources/runtime/scholion-runtime"
          fi
          uv run --no-sync python scripts/verify_packaged_release_trust_inputs.py \
            --runtime "$runtime" \
            --prepared-dir build/release-trust-inputs

      - name: Prove frozen runtime before bundling
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            runtime="frontend/src-tauri/resources/runtime/scholion-runtime.exe"
          else
            runtime="frontend/src-tauri/resources/runtime/scholion-runtime"
          fi
          uv run --no-sync python scripts/verify_packaged_runtime_acceptance.py "$runtime" \
            --model-trust-catalog packaging/release-trust/model-trust.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-fund --no-audit

      - name: Generate native application icons from reviewed master
        working-directory: frontend
        run: >-
          npm run tauri -- icon
          src-tauri/icons/scholion-master.svg
          --output src-tauri/icons

      - name: Build unsigned macOS preview package
        if: runner.os == 'macOS'
        working-directory: frontend
        run: >-
          npm run tauri -- build
          --config src-tauri/tauri.release.conf.json
          --bundles dmg

      - name: Build unsigned Windows preview package
        if: runner.os == 'Windows'
        working-directory: frontend
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "scholion-nsis-build.log"
          npm run tauri -- build --config src-tauri/tauri.release.conf.json --bundles nsis *>&1 |
            Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            exit $exitCode
          }

      - name: Upload Windows packaging diagnostics on failure
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scholion-nsis-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/scholion-nsis-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Mount exact DMG and qualify installed runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg="$(find frontend/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          mount_point="${RUNNER_TEMP}/scholion-preview-dmg"
          mkdir -p "$mount_point"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point" >/dev/null 2>&1 || true' EXIT
          app_bundle="$mount_point/Scholion.app"
          BUNDLE_PLIST="$app_bundle/Contents/Info.plist" \
          TAURI_CONFIG="frontend/src-tauri/tauri.conf.json" \
          python - <<'PY'
          import json
          import os
          import plistlib
          from pathlib import Path

          config = json.loads(Path(os.environ["TAURI_CONFIG"]).read_text())
          with Path(os.environ["BUNDLE_PLIST"]).open("rb") as handle:
              bundle = plistlib.load(handle)

          expected = {
              "CFBundleIdentifier": config["identifier"],
              "CFBundleShortVersionString": config["version"],
              "CFBundleName": config["productName"],
          }
          mismatches = {
              key: {"expected": value, "actual": bundle.get(key)}
              for key, value in expected.items()
              if bundle.get(key) != value
          }
          if mismatches:
              raise SystemExit(f"macOS bundle identity mismatch: {mismatches}")
          PY
          runtime="$app_bundle/Contents/Resources/runtime/scholion-runtime"
          test -x "$runtime"
          uv run --no-sync python scripts/verify_packaged_media_tools.py \
            --runtime "$runtime" \
            --evidence build/managed-media-tools/managed-media-tools.json
          uv run --no-sync python scripts/verify_packaged_release_trust_inputs.py \
            --runtime "$runtime" \
            --prepared-dir build/release-trust-inputs
          native_host_dir="$mount_point/Scholion.app/Contents/MacOS"
          native_host_count="$(find "$native_host_dir" -maxdepth 1 -type f -print | wc -l | tr -d ' ')"
          test "$native_host_count" -eq 1
          native_host="$(find "$native_host_dir" -maxdepth 1 -type f -print | head -n 1)"
          test -x "$native_host"
          uv run --no-sync python scripts/verify_production_update_fixture.py \
            --native-verifier "$native_host" \
            --fixture-dir packaging/release-trust/update-qualification
          uv run --no-sync python scripts/verify_packaged_runtime_acceptance.py "$runtime" \
            --model-trust-catalog packaging/release-trust/model-trust.json
          hdiutil detach "$mount_point"
          trap - EXIT

      - name: Qualify exact NSIS install, uninstall, and reinstall lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "frontend/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Tauri did not produce an NSIS installer"
          }

          $releaseConfig = Get-Content "frontend/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $installerVersion = $installer.VersionInfo
          if ($installerVersion.ProductName -ne $releaseConfig.productName) {
            throw "NSIS product name mismatch: expected '$($releaseConfig.productName)', found '$($installerVersion.ProductName)'"
          }
          if (-not $installerVersion.ProductVersion.StartsWith($releaseConfig.version)) {
            throw "NSIS product version mismatch: expected '$($releaseConfig.version)', found '$($installerVersion.ProductVersion)'"
          }

          $installDir = Join-Path $env:RUNNER_TEMP "scholion-preview-install"
          $retainedWorkspace = Join-Path $env:RUNNER_TEMP "scholion-retained-user-workspace"
          $reinstallWorkspace = Join-Path $env:RUNNER_TEMP "scholion-reinstall-acceptance"
          $mediaEvidence = "build/managed-media-tools/managed-media-tools.json"
          $trustEvidence = "build/release-trust-inputs"

          function Install-ScholionPreview {
            $process = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "NSIS preview install failed with exit code $($process.ExitCode)"
            }
            $runtime = Join-Path $installDir "runtime\scholion-runtime.exe"
            if (-not (Test-Path $runtime -PathType Leaf)) {
              throw "Installed Scholion runtime is missing"
            }
            $runtimeVersion = (Get-Item $runtime).VersionInfo
            if ($runtimeVersion.ProductName -ne $releaseConfig.productName) {
              throw "Frozen runtime product name mismatch: expected '$($releaseConfig.productName)', found '$($runtimeVersion.ProductName)'"
            }
            if (-not $runtimeVersion.ProductVersion.StartsWith($releaseConfig.version)) {
              throw "Frozen runtime product version mismatch: expected '$($releaseConfig.version)', found '$($runtimeVersion.ProductVersion)'"
            }
            return $runtime
          }

          function Uninstall-ScholionPreview {
            $uninstaller = Join-Path $installDir "uninstall.exe"
            if (-not (Test-Path $uninstaller -PathType Leaf)) {
              throw "Installed Scholion uninstaller is missing"
            }
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) {
              throw "NSIS preview uninstall failed with exit code $($uninstall.ExitCode)"
            }
            $runtime = Join-Path $installDir "runtime\scholion-runtime.exe"
            for ($attempt = 1; $attempt -le 20 -and (Test-Path $runtime -PathType Leaf); $attempt++) {
              Start-Sleep -Milliseconds 500
            }
            if (Test-Path $runtime -PathType Leaf) {
              throw "NSIS preview uninstall left the installed Scholion runtime behind"
            }
          }

          function Assert-PreservedUserState {
            param(
              [string]$CanonicalPath,
              [string]$CanonicalHash,
              [string]$CanaryPath,
              [string]$CanaryHash
            )
            if (-not (Test-Path $CanonicalPath -PathType Leaf)) {
              throw "NSIS lifecycle removed canonical transcript evidence outside the install directory"
            }
            if ((Get-FileHash -Algorithm SHA256 $CanonicalPath).Hash -ne $CanonicalHash) {
              throw "NSIS lifecycle modified canonical transcript evidence outside the install directory"
            }
            if (-not (Test-Path $CanaryPath -PathType Leaf)) {
              throw "NSIS lifecycle removed Scholion state outside the install directory"
            }
            if ((Get-FileHash -Algorithm SHA256 $CanaryPath).Hash -ne $CanaryHash) {
              throw "NSIS lifecycle modified Scholion state outside the install directory"
            }
          }

          $runtime = Install-ScholionPreview
          uv run --no-sync python scripts/verify_packaged_media_tools.py --runtime $runtime --evidence $mediaEvidence
          if ($LASTEXITCODE -ne 0) {
            throw "Installed Scholion managed media-tool qualification failed"
          }
          uv run --no-sync python scripts/verify_packaged_release_trust_inputs.py --runtime $runtime --prepared-dir $trustEvidence
          if ($LASTEXITCODE -ne 0) {
            throw "Installed Scholion production trust-input qualification failed"
          }
          $nativeHosts = @(Get-ChildItem $installDir -File -Filter *.exe | Where-Object { $_.Name -ne "uninstall.exe" })
          if ($nativeHosts.Count -ne 1) {
            throw "Expected exactly one packaged native Scholion host"
          }
          $nativeHostVersion = $nativeHosts[0].VersionInfo
          if ($nativeHostVersion.ProductName -ne $releaseConfig.productName) {
            throw "Native host product name mismatch: expected '$($releaseConfig.productName)', found '$($nativeHostVersion.ProductName)'"
          }
          if (-not $nativeHostVersion.ProductVersion.StartsWith($releaseConfig.version)) {
            throw "Native host product version mismatch: expected '$($releaseConfig.version)', found '$($nativeHostVersion.ProductVersion)'"
          }
          uv run --no-sync python scripts/verify_production_update_fixture.py --native-verifier $nativeHosts[0].FullName --fixture-dir packaging/release-trust/update-qualification
          if ($LASTEXITCODE -ne 0) {
            throw "Installed Scholion production update-signature qualification failed"
          }
          uv run --no-sync python scripts/verify_packaged_runtime_acceptance.py $runtime --workspace-root $retainedWorkspace --model-trust-catalog packaging/release-trust/model-trust.json
          if ($LASTEXITCODE -ne 0) {
            throw "Installed Scholion runtime acceptance failed"
          }

          $canonical = Get-ChildItem (Join-Path $retainedWorkspace "output\*.json") | Select-Object -First 1
          if (-not $canonical) {
            throw "Retained packaged acceptance did not create canonical transcript evidence"
          }
          $canonicalHash = (Get-FileHash -Algorithm SHA256 $canonical.FullName).Hash
          $canary = Join-Path $retainedWorkspace "state\lifecycle-preservation-canary.txt"
          Set-Content -Path $canary -Value "scholion-user-state-preservation-v1" -NoNewline
          $canaryHash = (Get-FileHash -Algorithm SHA256 $canary).Hash

          Uninstall-ScholionPreview
          Assert-PreservedUserState $canonical.FullName $canonicalHash $canary $canaryHash

          $runtime = Install-ScholionPreview
          Assert-PreservedUserState $canonical.FullName $canonicalHash $canary $canaryHash
          uv run --no-sync python scripts/verify_packaged_media_tools.py --runtime $runtime --evidence $mediaEvidence
          if ($LASTEXITCODE -ne 0) {
            throw "Reinstalled Scholion managed media-tool qualification failed"
          }
          uv run --no-sync python scripts/verify_packaged_release_trust_inputs.py --runtime $runtime --prepared-dir $trustEvidence
          if ($LASTEXITCODE -ne 0) {
            throw "Reinstalled Scholion production trust-input qualification failed"
          }
          $nativeHosts = @(Get-ChildItem $installDir -File -Filter *.exe | Where-Object { $_.Name -ne "uninstall.exe" })
          if ($nativeHosts.Count -ne 1) {
            throw "Expected exactly one packaged native Scholion host after reinstall"
          }
          $nativeHostVersion = $nativeHosts[0].VersionInfo
          if ($nativeHostVersion.ProductName -ne $releaseConfig.productName) {
            throw "Reinstalled native host product name mismatch: expected '$($releaseConfig.productName)', found '$($nativeHostVersion.ProductName)'"
          }
          if (-not $nativeHostVersion.ProductVersion.StartsWith($releaseConfig.version)) {
            throw "Reinstalled native host product version mismatch: expected '$($releaseConfig.version)', found '$($nativeHostVersion.ProductVersion)'"
          }
          uv run --no-sync python scripts/verify_production_update_fixture.py --native-verifier $nativeHosts[0].FullName --fixture-dir packaging/release-trust/update-qualification
          if ($LASTEXITCODE -ne 0) {
            throw "Reinstalled Scholion production update-signature qualification failed"
          }
          uv run --no-sync python scripts/verify_packaged_runtime_acceptance.py $runtime --workspace-root $reinstallWorkspace --model-trust-catalog packaging/release-trust/model-trust.json
          if ($LASTEXITCODE -ne 0) {
            throw "Reinstalled Scholion runtime acceptance failed"
          }
          $reinstallCanonical = Get-ChildItem (Join-Path $reinstallWorkspace "output\*.json") | Select-Object -First 1
          if (-not $reinstallCanonical) {
            throw "Reinstalled packaged acceptance did not create canonical transcript evidence"
          }

          Uninstall-ScholionPreview
          Assert-PreservedUserState $canonical.FullName $canonicalHash $canary $canaryHash
          if (-not (Test-Path $reinstallCanonical.FullName -PathType Leaf)) {
            throw "Final NSIS uninstall removed canonical evidence created after reinstall"
          }

      - name: Record preview artifact identity and unresolved release gates
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path

          bundle_root = Path("frontend/src-tauri/target/release/bundle")
          suffix = ".dmg" if os.environ["RUNNER_OS"] == "macOS" else ".exe"
          artifacts = sorted(
              path
              for path in bundle_root.rglob(f"*{suffix}")
              if path.is_file()
          )
          if not artifacts:
              raise SystemExit("no preview package artifact was produced")

          report_dir = Path("release-preview")
          report_dir.mkdir(parents=True, exist_ok=True)
          checksums = []
          artifact_records = []
          for artifact in artifacts:
              digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
              relative = artifact.relative_to(bundle_root).as_posix()
              checksums.append(f"{digest}  {relative}")
              artifact_records.append(
                  {
                      "path": relative,
                      "size_bytes": artifact.stat().st_size,
                      "sha256": digest,
                  }
              )
          (report_dir / "SHA256SUMS").write_text("\n".join(checksums) + "\n")
          media_evidence = Path("build/managed-media-tools/managed-media-tools.json")
          media_evidence_bytes = media_evidence.read_bytes()
          (report_dir / "managed-media-tools.json").write_bytes(media_evidence_bytes)
          trust_evidence = Path("build/release-trust-inputs/release-trust-inputs.json")
          trust_evidence_bytes = trust_evidence.read_bytes()
          (report_dir / "release-trust-inputs.json").write_bytes(trust_evidence_bytes)
          platform_lifecycle = (
              "windows-install-uninstall-reinstall-preserves-user-state"
              if os.environ["RUNNER_OS"] == "Windows"
              else "macos-dmg-mount-runtime-unmount"
          )
          report = {
              "schema_version": 1,
              "qualification": "unsigned-preview",
              "commit": os.environ["GITHUB_SHA"],
              "runner_os": os.environ["RUNNER_OS"],
              "platform_lifecycle": platform_lifecycle,
              "release_ready": False,
              "platform_trust": {
                  "scholion_release_verified": False,
                  "os_publisher_verified": False,
                  "os_notarized": False if os.environ["RUNNER_OS"] == "macOS" else None,
              },
              "managed_media_tools_evidence_sha256": hashlib.sha256(media_evidence_bytes).hexdigest(),
              "release_trust_inputs_evidence_sha256": hashlib.sha256(trust_evidence_bytes).hexdigest(),
              "qualified": {
                  "managed_scholion_runtime": True,
                  "managed_ffmpeg_ffprobe_custody": True,
                  "production_public_trust_inputs_bundled": True,
                  "packaged_model_policy_enforced": True,
                  "legacy_untrusted_model_fails_closed": True,
                  "production_update_signature_qualified": True,
                  "real_jfk_transcription_through_frozen_runtime": True,
                  "offline_inference_after_model_install": True,
                  "canonical_evidence_and_exports": True,
                  "locked_and_audited_packaging_toolchain": True,
                  "runtime_excludes_development_tooling": True,
                  "reviewed_master_native_icon_generation": True,
                  "pyinstaller_exact_6_22_3": True,
                  "tauri_package_build": True,
                  "exact_package_install_or_mount": True,
                  "package_identity_metadata": True,
                  "artifact_sha256": True,
              },
              "remaining_release_gates": [
                  "implement and qualify native update activation",
                  "apply and verify Windows code signing; qualify macOS project verification and non-notarized disclosure",
                  "complete representative-device qualification under issue #114",
              ],
              "artifacts": artifact_records,
          }
          (report_dir / "qualification.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )

      - name: Build deterministic provenance for exact qualified package
        shell: bash
        env:
          SCHOLION_RUNNER_ARCH: ${{ runner.arch }}
        run: >-
          uv run --no-sync python scripts/build_release_provenance.py
          --qualification release-preview/qualification.json
          --sha256sums release-preview/SHA256SUMS
          --bundle-root frontend/src-tauri/target/release/bundle
          --commit "${GITHUB_SHA}"
          --runner-os "${RUNNER_OS}"
          --runner-arch "${SCHOLION_RUNNER_ARCH}"
          --input packaging/release-trust/update-keys.json
          --input packaging/release-trust/model-trust.json
          --input build/release-trust-inputs/release-trust-inputs.json
          --input packaging/release-trust/update-qualification/payload.json
          --input packaging/release-trust/update-qualification/signature.bin
          --output release-preview/provenance.json

      - name: Upload exact preview package and qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scholion-preview-${{ runner.os }}-${{ github.sha }}
          path: |
            frontend/src-tauri/target/release/bundle/**/*.dmg
            frontend/src-tauri/target/release/bundle/**/*.exe
            release-preview/SHA256SUMS
            release-preview/managed-media-tools.json
            release-preview/release-trust-inputs.json
            release-preview/qualification.json
            release-preview/provenance.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
